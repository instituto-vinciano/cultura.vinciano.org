<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Links das publicações do Paraíba ponto Cultural.">
  <title>Paraíba ponto Cultural — Links</title>
  <style>
    :root{--bg:#090909;--fg:#f4f4f4;--muted:#a8a8a8;--red:#f10b0b;--gap:8px}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    .page{width:min(920px,100%);margin:auto;padding:38px 18px 54px}
    header{text-align:center}
    .logo{display:block;width:min(220px,52vw);height:auto;margin:0 auto 24px}
    .site-button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:1px solid #444;color:#fff;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.03em;transition:.18s ease}
    .site-button:hover,.site-button:focus-visible{border-color:var(--red);background:var(--red);outline:none}
    .divider{height:1px;background:#252525;margin:34px 0 18px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
    .card{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#151515;text-decoration:none;color:#fff}
    .card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .2s ease,opacity .2s ease}
    .card:hover img,.card:focus-visible img{transform:scale(1.025);opacity:.84}
    .card:focus-visible{outline:2px solid var(--red);outline-offset:2px}
    .placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:1px solid #242424;color:#666;font-size:12px;line-height:1.4}
    footer{text-align:center;color:#666;font-size:11px;margin-top:28px}
    @media(max-width:520px){.page{padding:28px 8px 38px}.logo{width:min(190px,52vw);margin-bottom:20px}.divider{margin:28px 0 8px}:root{--gap:4px}.site-button{font-size:13px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img class="logo" src="logo-paraiba-ponto-cultural.png" alt="Paraíba ponto Cultural">
      <a class="site-button" href="https://cultura.vinciano.org/">ACESSAR O SITE</a>
    </header>

    <div class="divider" aria-hidden="true"></div>

    <section class="grid" aria-label="Matérias recentes">
      <a class="card" href="https://cultura.vinciano.org/materias/2026-09-07-mac-cinema-grecia/index.html" aria-label="MAC promove sessões de cinema">
        <img src="mac-cinema-grecia-card.jpg" alt="MAC promove sessões de cinema" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-09-07-imagineland/index.html" aria-label="Imagineland chega a Campina Grande">
        <img src="imagineland-card.jpg" alt="Imagineland chega a Campina Grande" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-09-07-comunicurtas/index.html" aria-label="Inscrições abertas para o Comunicurtas">
        <img src="comunicurtas-card.jpg" alt="Inscrições abertas para o Comunicurtas" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-09-07-cha-da-pia/index.html" aria-label="Feira Cultural das Loiceiras em Areia">
        <img src="cha-da-pia-card.jpg" alt="Feira Cultural das Loiceiras em Areia" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-09-04-orbis26-natal/index.html" aria-label="Pulsares na Orbis 26">
        <img src="orbis-26-natal-card.jpg" alt="Pulsares na Orbis 26" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-08-22-literatura-cordel/index.html" aria-label="Jornada sobre cordel e xilo em Campina Grande">
        <img src="literatura-cordel-card.jpg" alt="Jornada sobre cordel e xilo em Campina Grande" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-08-17-fimq-ozberk-chorata/index.html" aria-label="Özberk Miraç no Festival Internacional de Música de Queimadas">
        <img src="ozberk-mirac-card.jpg" alt="Özberk Miraç no Festival Internacional de Música de Queimadas" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-08-12-pinturas-platibandas/index.html" aria-label="Pinturas e Platibandas">
        <img src="pinturas-e-platibandas-card.jpg" alt="Pinturas e Platibandas" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-07-26-cidade-hades/index.html" aria-label="Cidade Hades">
        <img src="cidade-hades-card.jpg" alt="Cidade Hades" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-07-22-nelida-campos/index.html" aria-label="Nélida Campos lança livro em Campina Grande">
        <img src="nelida-campos-card.jpg" alt="Nélida Campos lança livro em Campina Grande" loading="lazy">
      </a>
      <a class="card" href="https://cultura.vinciano.org/materias/2026-06-10-orquestra-jovem/index.html" aria-label="Orquestra da UFCG no MAC">
        <img src="orquestra-jovem-card.jpg" alt="Orquestra da UFCG no MAC" loading="lazy">
      </a>
    </section>

    <footer>Instituto Vinciano · Paraíba ponto Cultural</footer>
  </main>
</body>
</html>
